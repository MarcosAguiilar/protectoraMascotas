spring.application.name=protectora-registro-mascotas

# Render asigna el puerto en $PORT
server.port=${PORT:8080}

spring.datasource.url=${DB_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.h2.console.enabled=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.sql.init.mode=never

# Flyway es la unica fuente del esquema; no asumir versiones de bases existentes.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true

# Sin credenciales no se permite arrancar, tampoco en el perfil por defecto.
app.security.username=${API_USERNAME:}
app.security.password=${API_PASSWORD:}

springdoc.packages-to-scan=com.protectoraMascotas.controller
# Conservar la version del documento publicada antes de migrar a Springdoc 2.x.
springdoc.api-docs.version=OPENAPI_3_0

# Mantener los valores predeterminados JSON de Boot 3 usando Jackson 3.
spring.jackson.use-jackson2-defaults=true

# No exponer detalles internos en errores inesperados, tampoco con DevTools.
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false
server.error.include-stacktrace=never
