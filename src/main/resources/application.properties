spring.application.name=protectora-registro-mascotas

# Render asigna el puerto en $PORT
server.port=${PORT:8080}

spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.h2.console.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop

# Sin credenciales no se permite arrancar, tampoco en el perfil por defecto.
app.security.username=${API_USERNAME:}
app.security.password=${API_PASSWORD:}
